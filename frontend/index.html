    <style>
      /* Scrollbar width */
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

/* Track (background) */
::-webkit-scrollbar-track {
  background: #1a1a1a;
  border-radius: 10px;
}

/* Scrollbar thumb */
::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #ff003c, #8a2be2);
  border-radius: 10px;
  border: 2px solid #1a1a1a;
}

/* Hover effect */
::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #ff1f5a, #a855f7);
}

/* Active click effect */
::-webkit-scrollbar-thumb:active {
  background: linear-gradient(180deg, #d0002a, #7c3aed);
}
